# ARM64 control-plane Registration / SeedImage for arm-workloadcluster.
# Apply on the management cluster after Bare Metal Provider and ARM images are ready.
# Worker uses worker/01-registration-seedimage.yaml, not this pair.
apiVersion: elemental.cattle.io/v1beta1
kind: MachineRegistration
metadata:
  name: arm-workloadcluster-cp-registration
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    kubernetes.io/arch: arm64
spec:
  # ${...} placeholders are expanded by elemental-register from SMBIOS data.
  # System UUID is preferred over Serial Number because it is more reliable
  # across virtualised test environments.
  machineName: "arm-workloadcluster-cp-arm64-${System Information/UUID}"
  machineInventoryLabels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    kubernetes.io/arch: arm64
    pool.baremetal.alauda.io/eligible: "true"
    elemental.cattle.io/serial-number: "${System Information/Serial Number}"
    os.baremetal.alauda.io/id: alaudaos.k.25
    os.baremetal.alauda.io/arch: "${Runtime/Architecture}"
  machineInventoryAnnotations:
    elemental.cattle.io/machine-uuid: "${System Information/UUID}"
  config:
    elemental:
      install:
        # Recommended: keep this generic path in the ISO. Do not bake
        # a host disk such as /dev/sda into SeedImage. On each Live ISO,
        # symlink the real OS disk to this path, then after install set
        # BMC boot order to disk-first and eject the ISO (see README).
        device: /dev/elemental-install-target
        system-uri: "10.243.166.5:11443/tkestack/kubeos-rootfs:<K25_ARM64_IMAGE_TAG>"
        eject-cd: true
        reboot: true
      registration:
        # false only when the host has a real hardware TPM (/dev/tpm0). Set true
        # (with emulated-tpm-seed: -1) on any host without one, including physical
        # servers that ship without a TPM module.
        emulate-tpm: true
        emulated-tpm-seed: -1
---
apiVersion: elemental.cattle.io/v1beta1
kind: SeedImage
metadata:
  name: arm-workloadcluster-cp-registration-iso
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
spec:
  type: iso
  baseImage: "10.243.166.5:11443/tkestack/kubeos-iso:<K25_ARM64_IMAGE_TAG>"
  registrationRef:
    apiVersion: elemental.cattle.io/v1beta1
    kind: MachineRegistration
    name: arm-workloadcluster-cp-registration
    namespace: cpaas-system
  targetPlatform: linux/arm64
  size: 20Gi
  cleanupAfterMinutes: 240
  cloud-config:
    name: live-registry
    stages:
      network:
        - files:
            - path: /etc/containers/registries.conf.d/99-bootstrap-registry.conf
              permissions: 0644
              content: |
                [[registry]]
                location = "10.243.166.5:11443"
                insecure = true
