# Control-plane BaremetalMachineTemplate. Points at arm-workloadcluster-control-plane-pool.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalMachineTemplate
metadata:
  name: arm-workloadcluster-control-plane-template
  namespace: "<MANAGEMENT_NAMESPACE>"
spec:
  template:
    spec:
      machineInventoryPoolRef:
        name: arm-workloadcluster-control-plane-pool
