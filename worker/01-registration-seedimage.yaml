# ARM64 Worker Registration / SeedImage.
# Do not reuse an x86 Worker ISO. Use the same K25 ARM64
# ISO/rootfs tag as the control-plane Registration.
# Apply after the ARM K25 images are in the platform registry.
apiVersion: elemental.cattle.io/v1beta1
kind: MachineRegistration
metadata:
  name: arm-workloadcluster-worker-registration
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    kubernetes.io/arch: arm64
spec:
  machineName: "arm-workloadcluster-worker-arm64-${System Information/UUID}"
  machineInventoryLabels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    kubernetes.io/arch: arm64
    pool.baremetal.alauda.io/eligible: "true"
    elemental.cattle.io/serial-number: "${System Information/Serial Number}"
    os.baremetal.alauda.io/id: alaudaos.k.25
    os.baremetal.alauda.io/arch: "${Runtime/Architecture}"
  machineInventoryAnnotations:
    elemental.cattle.io/machine-uuid: "${System Information/UUID}"
  config:
    elemental:
      install:
        device: /dev/elemental-install-target
        system-uri: "10.243.166.5:11443/tkestack/kubeos-rootfs:<K25_ARM64_IMAGE_TAG>"
        eject-cd: true
        reboot: true
      registration:
        emulate-tpm: true
        emulated-tpm-seed: -1
---
apiVersion: elemental.cattle.io/v1beta1
kind: SeedImage
metadata:
  name: arm-workloadcluster-worker-registration-iso
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    kubernetes.io/arch: arm64
spec:
  type: iso
  baseImage: "10.243.166.5:11443/tkestack/kubeos-iso:<K25_ARM64_IMAGE_TAG>"
  targetPlatform: linux/arm64
  size: 20Gi
  cleanupAfterMinutes: 240
  registrationRef:
    apiVersion: elemental.cattle.io/v1beta1
    kind: MachineRegistration
    name: arm-workloadcluster-worker-registration
    namespace: cpaas-system
  cloud-config:
    name: live-registry
    stages:
      network:
        - files:
            - path: /etc/containers/registries.conf.d/99-bootstrap-registry.conf
              permissions: 0644
              content: |
                [[registry]]
                location = "10.243.166.5:11443"
                insecure = true
